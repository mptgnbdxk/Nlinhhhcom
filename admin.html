<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Quản lí tranh của Nlinh nì ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --danger: #e76f51;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-container {
      width: 100%;
      max-width: 900px;
    }

    .admin-card {
      background: var(--card-bg);
      width: 100%;
      padding: 32px 24px;
      border-radius: 24px;
      border: 1px solid #f6ccd6;
      box-shadow: 0 15px 40px rgba(216, 112, 147, 0.1);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      color: var(--ink);
      margin-bottom: 6px;
    }

    p.desc {
      font-size: 0.88rem;
      color: var(--sub);
      margin-bottom: 22px;
    }

    /* ĐĂNG NHẬP */
    .auth-section {
      max-width: 360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-size: 15px;
      outline: none;
      text-align: center;
    }

    input[type="password"]:focus {
      border-color: var(--pink);
    }

    .btn-action {
      padding: 12px 22px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(216, 112, 147, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    /* THANH UPLOAD GỌN GÀNG */
    .upload-control-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      background: #fff5f7;
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed #f1b3c3;
      margin-bottom: 22px;
    }

    .category-select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #ecd5db;
      background: white;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }

    /* TABS */
    .gallery-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid #ecd5db;
      background: white;
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    /* LƯỚI TRANH TỐI GIẢN */
    .manager-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      text-align: left;
    }

    .art-card {
      background: white;
      border-radius: 14px;
      border: 1.5px solid #f6ccd6;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(216, 112, 147, 0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: grab;
      user-select: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .art-card:active {
      cursor: grabbing;
    }

    .art-card.sortable-ghost {
      opacity: 0.3;
      border: 2px dashed var(--pink);
    }

    .art-card.sortable-chosen {
      box-shadow: 0 10px 25px rgba(216, 112, 147, 0.25);
    }

    /* NÚT XÓA TINH GỌN (GÓC TRÊN ẢNH) */
    .btn-delete-quick {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #f8ccd4;
      color: #b86278;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-delete-quick:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
      transform: scale(1.1);
    }

    .art-card img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #fafafa;
      pointer-events: none;
      display: block;
    }

    /* CHÂN CARD: CHỈ GỒM MENU CHỌN MỤC & SỐ THỨ TỰ */
    .art-card-footer {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #fffdfd;
      border-top: 1px solid #faedf0;
    }

    /* Menu đổi mục trực tiếp dạng select gọn nhẹ */
    .select-card-cat {
      flex: 1;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #ecd5db;
      background: #fff8fa;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--pink);
      outline: none;
      cursor: pointer;
    }

    .select-card-cat:focus {
      border-color: var(--pink);
    }

    .art-order-badge {
      color: var(--sub);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 24px;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--sub);
      grid-column: 1 / -1;
      font-size: 0.9rem;
    }

    .back-home {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--sub);
      text-decoration: none;
    }

    .back-home:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Quản Lý Tranh Của Nlinh</h1>
      <p class="desc">Chỉ cần kéo thả ảnh để đổi thứ tự, hoặc chọn lại mục ngay dưới ảnh nha babi ♡</p>

      <!-- Khóa mật khẩu -->
      <div id="authSection" class="auth-section">
        <input type="password" id="secretPass" placeholder="Nhập mật khẩu artist..." autofocus />
        <button class="btn-action" id="btnUnlock">Mở khóa Studio ♡</button>
      </div>

      <!-- Khu vực Studio -->
      <div id="studioSection" style="display: none;">
        
        <!-- Thanh Upload -->
        <div class="upload-control-panel">
          <label for="uploadCategory" style="font-weight: 700; font-size: 0.88rem;">Tải tranh ebe vào mục:</label>
          <select id="uploadCategory" class="category-select">
            <option value="chibi">Chibi Portrait</option>
            <option value="head">Headshot</option>
            <option value="half">Half body</option>
            <option value="full">Full body</option>
            <option value="couple">Couple</option>
          </select>
          <button class="btn-action" id="btnUploadImage">✨ Tải ảnh lên</button>
        </div>

        <!-- Bộ lọc tab -->
        <div class="gallery-tabs">
          <button class="tab-btn active" data-filter="all">Tất cả tranh</button>
          <button class="tab-btn" data-filter="chibi">Chibi</button>
          <button class="tab-btn" data-filter="head">Head shots</button>
          <button class="tab-btn" data-filter="half">Half Body</button>
          <button class="tab-btn" data-filter="full">Full Body</button>
          <button class="tab-btn" data-filter="couple">Couple</button>
        </div>

        <!-- Lưới tranh siêu tinh gọn -->
        <div class="manager-grid" id="managerGrid">
          <div class="empty-state">Đang tải danh sách tranh...</div>
        </div>

        <a href="index.html" class="back-home">← Quay lại trang chủ xem kết quả</a>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_CONFIG = {
      cloudName: 'o6quhhtx',
      uploadPreset: 'nlinh_preset',
      artistPassword: 'Nlinhdangyeusiucute123'
    };

    const authSection = document.getElementById('authSection');
    const studioSection = document.getElementById('studioSection');
    const secretPassInput = document.getElementById('secretPass');
    const btnUnlock = document.getElementById('btnUnlock');
    const btnUpload = document.getElementById('btnUploadImage');
    const uploadCategory = document.getElementById('uploadCategory');
    const managerGrid = document.getElementById('managerGrid');
    const tabBtns = document.querySelectorAll('.tab-btn');

    let currentFilter = 'all';
    let sortableInstance = null;

    if (sessionStorage.getItem('artist_authenticated') === 'true') {
      authSection.style.display = 'none';
      studioSection.style.display = 'block';
      renderManagerGrid();
    }

    btnUnlock.addEventListener('click', () => {
      if (secretPassInput.value.trim() === CLOUD_CONFIG.artistPassword) {
        sessionStorage.setItem('artist_authenticated', 'true');
        authSection.style.display = 'none';
        studioSection.style.display = 'block';
        renderManagerGrid();
      } else {
        alert('Mật khẩu chưa đúng nha ♡');
      }
    });

    secretPassInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnUnlock.click();
    });

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderManagerGrid();
      });
    });

    function getStoredArtworks() {
      return JSON.parse(localStorage.getItem('nlinh_gallery_data') || '[]');
    }

    function saveStoredArtworks(data) {
      localStorage.setItem('nlinh_gallery_data', JSON.stringify(data));
    }

    function renderManagerGrid() {
      const artworks = getStoredArtworks();
      const filtered = currentFilter === 'all' 
        ? artworks 
        : artworks.filter(item => item.category === currentFilter);

      if (filtered.length === 0) {
        managerGrid.innerHTML = `<div class="empty-state">Chưa có tranh nào trong mục này ♡ Bấm "Tải ảnh lên" ở trên nhé! luv u</div>`;
        return;
      }

      managerGrid.innerHTML = '';
      filtered.forEach((art, idx) => {
        const card = document.createElement('div');
        card.className = 'art-card';
        card.setAttribute('data-id', art.id);
        card.innerHTML = `
          <!-- Nút xóa tròn nhỏ góc trên -->
          <button class="btn-delete-quick" onclick="deleteArtwork('${art.id}')" title="Xóa tranh nì">×</button>
          
          <img src="${art.url}" alt="Artwork" loading="lazy" />
          
          <!-- Chân card: Đổi mục nhanh bằng dropdown + số thứ tự -->
          <div class="art-card-footer">
            <select class="select-card-cat" onchange="onCategoryChange('${art.id}', this.value)" title="Đổi sang mục khác">
              <option value="chibi" ${art.category === 'chibi' ? 'selected' : ''}>Chibi</option>
              <option value="head" ${art.category === 'head' ? 'selected' : ''}>Headshot</option>
              <option value="half" ${art.category === 'half' ? 'selected' : ''}>Half body</option>
              <option value="full" ${art.category === 'full' ? 'selected' : ''}>Full body</option>
              <option value="couple" ${art.category === 'couple' ? 'selected' : ''}>Couple</option>
            </select>
            <span class="art-order-badge">#${idx + 1}</span>
          </div>
        `;
        managerGrid.appendChild(card);
      });

      initSortable();
    }

    // Kéo thả đổi vị trí 
    function initSortable() {
      if (sortableInstance) sortableInstance.destroy();

      sortableInstance = new Sortable(managerGrid, {
        animation: 200,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        filter: '.btn-delete-quick, .select-card-cat',
        preventOnFilter: false,
        onEnd: function () {
          const currentCards = Array.from(managerGrid.querySelectorAll('.art-card'));
          const orderedIds = currentCards.map(c => c.getAttribute('data-id'));
          let allArts = getStoredArtworks();

          if (currentFilter === 'all') {
            const artMap = new Map(allArts.map(a => [a.id, a]));
            allArts = orderedIds.map(id => artMap.get(id)).filter(Boolean);
          } else {
            const filterSet = new Set(orderedIds);
            const artMap = new Map(allArts.filter(a => filterSet.has(a.id)).map(a => [a.id, a]));
            const reorderedSubset = orderedIds.map(id => artMap.get(id)).filter(Boolean);

            let subIndex = 0;
            allArts = allArts.map(item => {
              if (item.category === currentFilter) {
                return reorderedSubset[subIndex++];
              }
              return item;
            });
          }

          saveStoredArtworks(allArts);
          
          // Cập nhật lại số #1, #2...
          currentCards.forEach((card, index) => {
            const badge = card.querySelector('.art-order-badge');
            if (badge) badge.textContent = `#${index + 1}`;
          });
        }
      });
    }

    // Đổi mục trực tiếp khi chọn menu thả xuống ngay dưới ảnh
    window.onCategoryChange = function(id, newCat) {
      let allArts = getStoredArtworks();
      const targetArt = allArts.find(a => a.id === id);
      if (!targetArt) return;

      // Xóa khỏi vị trí cũ, chuyển mục và chèn lên đầu mục mới (#1)
      allArts = allArts.filter(a => a.id !== id);
      targetArt.category = newCat;

      let targetCatList = allArts.filter(a => a.category === newCat);
      let others = allArts.filter(a => a.category !== newCat);

      targetCatList.unshift(targetArt); // Tự động đưa lên đầu mục mới
      allArts = [...targetCatList, ...others];

      saveStoredArtworks(allArts);
      renderManagerGrid();
    };

    // Xóa tranh
    window.deleteArtwork = function(id) {
      if (confirm('Xóa bức tranh này khỏi web nha cậu?')) {
        let arts = getStoredArtworks();
        arts = arts.filter(a => a.id !== id);
        saveStoredArtworks(arts);
        renderManagerGrid();
      }
    };

    // Upload Widget
    let myWidget = null;
    if (window.cloudinary) {
      myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_CONFIG.cloudName,
        uploadPreset: CLOUD_CONFIG.uploadPreset,
        sources: ['local', 'camera'],
        multiple: true,
        maxFileSize: 6000000,
        maxImageWidth: 2000,
        maxImageHeight: 2000,
        clientAllowedFormats: ['png', 'jpg', 'jpeg', 'webp'],
        styles: {
          palette: {
            window: "#FFFDFD",
            sourceBg: "#FFF8FA",
            windowBorder: "#F6CCD6",
            tabIcon: "#D87093",
            inactiveTabIcon: "#9B858D",
            menuIcons: "#D87093",
            link: "#D87093",
            action: "#D87093",
            inProgress: "#E8A3B6",
            complete: "#70C28A",
            error: "#F86E8A",
            textDark: "#5A4B51",
            textLight: "#FFFFFF"
          }
        }
      }, (error, result) => {
        if (!error && result) {
          if (result.event === "success") {
            const selectedCat = uploadCategory.value;
            const newArt = {
              id: result.info.public_id,
              url: result.info.secure_url,
              category: selectedCat,
              createdAt: new Date().toISOString()
            };
            let arts = getStoredArtworks();
            arts.unshift(newArt);
            saveStoredArtworks(arts);
          } else if (result.event === "close") {
            renderManagerGrid();
          }
        }
      });
    }

    btnUpload.addEventListener('click', () => {
      if (myWidget) {
        myWidget.update({
          tags: ['commission_art', uploadCategory.value]
        });
        myWidget.open();
      }
    });
  </script>
</body>
</html>
