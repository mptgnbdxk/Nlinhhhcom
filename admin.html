<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Studio — Nlinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --border: #f6ccd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 600px; }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(216, 112, 147, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    select {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      background: white;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 340px;
    }

    .btn-main {
      padding: 14px 28px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(216, 112, 147, 0.25);
      transition: transform 0.2s, background 0.2s;
      width: 100%;
      max-width: 340px;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    .status-msg {
      margin-top: 18px;
      font-size: 0.95rem;
      color: var(--pink);
      font-weight: 600;
      display: none;
    }

    .links-footer {
      margin-top: 25px;
    }
    .links-footer a {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .links-footer a:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Tải Tranh Của Nlinh</h1>
      <p class="subtitle">Tải tranh lên Cloudinary và tự động đồng bộ trên toàn bộ thiết bị ♡</p>

      <div class="form-group">
        <label for="categorySelect" style="font-weight: 700; font-size: 0.9rem;">Chọn mục tranh muốn up:</label>
        <select id="categorySelect">
          <option value="chibi">Chibi Portrait</option>
          <option value="head">Head Shots</option>
          <option value="half">Half Body</option>
          <option value="full">Full Body</option>
          <option value="couple">Couple</option>
        </select>
      </div>

      <button type="button" class="btn-main" id="uploadBtn">🌸 Bấm vào đây để chọn ảnh tải lên</button>
      <div id="statusMsg" class="status-msg"></div>

      <div class="links-footer">
        <a href="index.html">← Về trang chủ</a>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_NAME = 'o6quhhtx';
    const UPLOAD_PRESET = 'nlinh_art';

    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const categorySelect = document.getElementById('categorySelect');

    let myWidget = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local', 'camera', 'url'],
      tags: ['commission_art', 'category_' + categorySelect.value]
    }, (error, result) => {
      if (!error && result && result.event === "success") {
        statusMsg.style.display = 'block';
        statusMsg.textContent = '✨ Tải ảnh lên thành công! Trang web trên mọi thiết bị sẽ tự cập nhật ♡';
      }
    });

    uploadBtn.addEventListener('click', () => {
      const selectedCat = categorySelect.value;
      myWidget.update({
        tags: ['commission_art', 'category_' + selectedCat]
      });
      myWidget.open();
    });
  </script>
</body>
</html>
