<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Studio — Quản Lý Tranh ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="gallery-data.js"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --danger: #e76f51;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-container {
      width: 100%;
      max-width: 900px;
    }

    .admin-card {
      background: var(--card-bg);
      width: 100%;
      padding: 32px 24px;
      border-radius: 24px;
      border: 1px solid #f6ccd6;
      box-shadow: 0 15px 40px rgba(216, 112, 147, 0.1);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      color: var(--ink);
      margin-bottom: 6px;
    }

    p.desc {
      font-size: 0.88rem;
      color: var(--sub);
      margin-bottom: 22px;
    }

    /* ĐĂNG NHẬP */
    .auth-section {
      max-width: 360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .password-wrap {
      position: relative;
      width: 100%;
    }

    input[type="password"], input[type="text"].pw-active {
      width: 100%;
      padding: 13px 44px 13px 18px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-size: 15px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--pink);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #b86278;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    .toggle-pw-btn:hover {
      opacity: 1;
    }

    .toggle-pw-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .btn-action {
      padding: 12px 22px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(216, 112, 147, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    /* THANH CÔNG CỤ TẢI TRANH & ĐỒNG BỘ */
    .top-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      background: #fff5f7;
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed #f1b3c3;
      margin-bottom: 22px;
    }

    .category-select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #ecd5db;
      background: white;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }

    .btn-sync {
      padding: 10px 18px;
      background: #ffffff;
      color: var(--pink);
      border: 1.5px solid var(--pink);
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sync:hover {
      background: var(--pink);
      color: white;
    }

    /* BỘ LỌC TABS */
    .gallery-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid #ecd5db;
      background: white;
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    /* LƯỚI TRANH QUẢN LÝ */
    .manager-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      text-align: left;
    }

    .art-card {
      background: white;
      border-radius: 14px;
      border: 1.5px solid #f6ccd6;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(216, 112, 147, 0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: grab;
      user-select: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .art-card:active {
      cursor: grabbing;
    }

    .art-card.sortable-ghost {
      opacity: 0.3;
      border: 2px dashed var(--pink);
    }

    .art-card.sortable-chosen {
      box-shadow: 0 10px 25px rgba(216, 112, 147, 0.25);
    }

    .btn-delete-quick {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #f8ccd4;
      color: #b86278;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-delete-quick:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
      transform: scale(1.1);
    }

    .art-card img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #fafafa;
      pointer-events: none;
      display: block;
    }

    .art-card-footer {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #fffdfd;
      border-top: 1px solid #faedf0;
    }

    .select-card-cat {
      flex: 1;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #ecd5db;
      background: #fff8fa;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--pink);
      outline: none;
      cursor: pointer;
    }

    .select-card-cat:focus {
      border-color: var(--pink);
    }

    .art-order-badge {
      color: var(--sub);
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 24px;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--sub);
      grid-column: 1 / -1;
      font-size: 0.9rem;
    }

    .back-home {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--sub);
      text-decoration: none;
    }

    .back-home:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

    <div class="admin-card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Quản Lý Tranh Của Nlinh</h1>
      <p class="desc">Kéo thả đổi vị trí, hoặc bấm "Đồng bộ cho điện
