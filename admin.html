<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Studio — Nlinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --border: #f6ccd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 820px; }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(216, 112, 147, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 24px;
    }

    .upload-toolbar {
      background: #fff5f7;
      border: 1.5px dashed #f1b3c3;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    select {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
      background: white;
      outline: none;
      cursor: pointer;
    }

    .btn-main {
      padding: 12px 26px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(216, 112, 147, 0.25);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    .status-msg {
      margin-bottom: 18px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #edf7ed;
      color: #2e7d32;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid #ecd5db;
      background: white;
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .art-item {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(216, 112, 147, 0.05);
    }

    .art-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #fafafa;
    }

    .art-tag {
      padding: 8px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--pink);
      background: #fffcfd;
      border-top: 1px solid #f9ebef;
      text-transform: uppercase;
    }

    .empty-note {
      grid-column: 1 / -1;
      padding: 28px;
      color: var(--sub);
      font-size: 0.9rem;
    }

    .links-footer {
      margin-top: 16px;
    }
    .links-footer a {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .links-footer a:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Quản Lý Tranh Của Nlinh</h1>
      <p class="subtitle">Chọn mục và tải tranh lên — Tự động đồng bộ trên mọi điện thoại & máy tính ♡</p>

      <div class="upload-toolbar">
        <label for="categorySelect" style="font-weight: 700; font-size: 0.9rem;">Danh mục:</label>
        <select id="categorySelect">
          <option value="chibi">Chibi Portrait</option>
          <option value="head">Head Shots</option>
          <option value="half">Half Body</option>
          <option value="full">Full Body</option>
          <option value="couple">Couple</option>
        </select>

        <button type="button" class="btn-main" id="uploadBtn">🌸 Chọn ảnh tải lên</button>
      </div>

      <div id="statusMsg" class="status-msg"></div>

      <div class="tabs">
        <button class="tab-btn active" data-filter="all">Tất cả</button>
        <button class="tab-btn" data-filter="chibi">Chibi</button>
        <button class="tab-btn" data-filter="head">Head</button>
        <button class="tab-btn" data-filter="half">Half</button>
        <button class="tab-btn" data-filter="full">Full</button>
        <button class="tab-btn" data-filter="couple">Couple</button>
      </div>

      <div class="grid" id="adminGrid">
        <div class="empty-note">Đang tải danh sách tranh từ Cloudinary...</div>
      </div>

      <div class="links-footer">
        <a href="index.html">← Quay về trang chủ xem Gallery</a>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_NAME = 'o6quhhtx';
    // LƯU Ý: Điền đúng tên Upload Preset Unsigned trên Cloudinary của bạn ('nlinh_art' hoặc 'nlinh_preset')
    const UPLOAD_PRESET = 'nlinh_art';

    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const categorySelect = document.getElementById('categorySelect');
    const adminGrid = document.getElementById('adminGrid');

    let allArts = [];
    let currentFilter = 'all';

    // Khởi tạo Widget Cloudinary
    const myWidget = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local', 'camera', 'url'],
      clientAllowedFormats: ['png', 'jpg', 'jpeg', 'webp', 'gif']
    }, (error, result) => {
      if (!error && result && result.event === "success") {
        const selectedCat = categorySelect.value;
        const newArt = {
          id: result.info.public_id,
          url: result.info.secure_url,
          category: selectedCat
        };

        // Thêm ngay vào đầu danh sách hiển thị
        allArts.unshift(newArt);
        renderAdminGrid();

        statusMsg.style.display = 'block';
        statusMsg.textContent = '✨ Đã tải ảnh lên thành công!(Lưu ý: Cloudinary có thể mất khoảng 10-30 giây để cập nhật danh sách đồng bộ sang các máy khác) ♡';
      }
    });

    uploadBtn.addEventListener('click', () => {
      const selectedCat = categorySelect.value;
      // Gắn cả tag chung 'commission_art', tag mục riêng và context.custom.category để đồng bộ 100%
      myWidget.update({
        tags: ['commission_art', selectedCat],
        context: { category: selectedCat }
      });
      myWidget.open();
    });

    // Hàm tải danh sách tranh đang có trên Cloudinary
    async function fetchCloudArts() {
      try {
        const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/commission_art.json?_t=${Date.now()}`);
        if (!res.ok) {
          adminGrid.innerHTML = '<div class="empty-note">Chưa có tranh nào trên Cloudinary (Hãy bấm nút tải lên bức tranh đầu tiên nhé!) ♡</div>';
          return;
        }
        const data = await res.json();
        if (data && data.resources) {
          allArts = data.resources.map(r => {
            const cat = (r.context && r.context.custom && r.context.custom.category) || 'chibi';
            return {
              id: r.public_id,
              url: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto/v${r.version}/${r.public_id}.${r.format}`,
              category: cat
            };
          });
          renderAdminGrid();
        }
      } catch (err) {
        adminGrid.innerHTML = '<div class="empty-note">Chưa có tranh nào được tải lên ♡</div>';
      }
    }

    function renderAdminGrid() {
      adminGrid.innerHTML = '';
      const filtered = currentFilter === 'all'
        ? allArts
        : allArts.filter(a => a.category === currentFilter);

      if (filtered.length === 0) {
        adminGrid.innerHTML = '<div class="empty-note">Chưa có tranh nào trong mục này ♡</div>';
        return;
      }

      filtered.forEach(art => {
        const div = document.createElement('div');
        div.className = 'art-item';
        div.innerHTML = `
          <img src="${art.url}" alt="${art.category}" loading="lazy">
          <div class="art-tag">${art.category}</div>
        `;
        adminGrid.appendChild(div);
      });
    }

    // Chuyển tab lọc
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAdminGrid();
      });
    });

    fetchCloudArts();
  </script>
</body>
</html>
