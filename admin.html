<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Studio — Nlinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --danger: #e76f51;
      --border: #f6ccd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(216, 112, 147, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 24px;
    }

    /* KHUNG ĐĂNG NHẬP */
    .login-box {
      max-width: 360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-size: 15px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--pink);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .toggle-pw-btn svg {
      width: 20px;
      height: 20px;
    }

    .btn-main {
      padding: 12px 24px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(216, 112, 147, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    /* BẢNG ĐIỀU KHIỂN SAU KHI ĐĂNG NHẬP */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      background: #fff5f7;
      border: 1px dashed #f1b3c3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .toolbar select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #ecd5db;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      background: white;
      cursor: pointer;
    }

    .btn-secondary {
      padding: 10px 18px;
      background: white;
      color: var(--pink);
      border: 1.5px solid var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--pink);
      color: white;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid #ecd5db;
      background: white;
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    /* GRID TRANH */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      text-align: left;
      margin-bottom: 24px;
    }

    .art-item {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 10px rgba(216, 112, 147, 0.05);
      display: flex;
      flex-direction: column;
    }

    .art-item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #fafafa;
    }

    .art-meta {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #fffcfd;
      border-top: 1px solid #f9ebef;
    }

    .art-meta select {
      flex: 1;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid #ecd5db;
      font-size: 0.8rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: var(--pink);
      background: white;
      outline: none;
      cursor: pointer;
    }

    .btn-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #f8ccd4;
      color: var(--danger);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
      transform: scale(1.1);
    }

    .empty-note {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
      color: var(--sub);
      font-size: 0.9rem;
    }

    .links-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .links-footer a {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.85rem;
    }

    .links-footer a:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Quản Lý Tranh Của Nlinh</h1>
