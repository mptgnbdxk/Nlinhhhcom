<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Studio — Nlinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --danger: #e76f51;
      --border: #f6ccd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 820px; }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(216, 112, 147, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 24px;
    }

    /* KHUNG ĐĂNG NHẬP */
    .login-box {
      max-width: 340px;
      margin: 0 auto 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-size: 15px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--pink);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--pink);
      font-size: 16px;
      padding: 4px;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    /* KHU VỰC QUẢN LÝ (ẨN KHI CHƯA LOGIN) */
    #studioPanel {
      display: none;
    }

    .upload-toolbar {
      background: #fff5f7;
      border: 1.5px dashed #f1b3c3;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    select {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1.5px solid #ecd5db;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
      background: white;
      outline: none;
      cursor: pointer;
    }

    .btn-main {
      padding: 12px 26px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(216, 112, 147, 0.25);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    .btn-logout {
      padding: 8px 16px;
      background: #f8e8ee;
      color: var(--ink);
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-logout:hover {
      background: #f1d4df;
    }

    .status-msg {
      margin-bottom: 18px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #edf7ed;
      color: #2e7d32;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid #ecd5db;
      background: white;
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .art-item {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(216, 112, 147, 0.05);
    }

    .art-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #fafafa;
    }

    .art-tag {
      padding: 8px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--pink);
      background: #fffcfd;
      border-top: 1px solid #f9ebef;
      text-transform: uppercase;
    }

    .empty-note {
      grid-column: 1 / -1;
      padding: 28px;
      color: var(--sub);
      font-size: 0.9rem;
    }

    .links-footer {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 16px;
      align-items: center;
    }
    .links-footer a {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .links-footer a:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Quản Lý Tranh Của Nlinh</h1>
      <p class="subtitle" id="subText">Vui lòng nhập mật khẩu để mở khóa phòng tranh ♡</p>

      <!-- MÀN HÌNH KHÓA MẬT KHẨU -->
      <div class="login-box" id="loginSection">
        <div class="input-wrapper">
          <input type="password" id="pwInput" placeholder="Nhập mật khẩu bí mật..." autocomplete="off">
          <button type="button" class="toggle-pw-btn" id="togglePwBtn" title="Hiện/Ẩn mật khẩu">👁️</button>
        </div>
        <div class="error-msg" id="errorMsg">Mật khẩu chưa đúng rồi, thử lại nhé!</div>
        <button type="button" class="btn-main" id="loginBtn">🔒 Mở khóa Studio</button>
      </div>

      <!-- GIAO DIỆN QUẢN LÝ (CHỈ HIỆN KHI ĐÚNG MẬT KHẨU) -->
      <div id="studioPanel">
        <div class="upload-toolbar">
          <label for="categorySelect" style="font-weight: 700; font-size: 0.9rem;">Danh mục:</label>
          <select id="categorySelect">
            <option value="chibi">Chibi Portrait</option>
            <option value="head">Head Shots</option>
            <option value="half">Half Body</option>
            <option value="full">Full Body</option>
            <option value="couple">Couple</option>
          </select>

          <button type="button" class="btn-main" id="uploadBtn">🌸 Chọn ảnh tải lên</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div class="tabs">
          <button class="tab-btn active" data-filter="all">Tất cả</button>
          <button class="tab-btn" data-filter="chibi">Chibi</button>
          <button class="tab-btn" data-filter="head">Head</button>
          <button class="tab-btn" data-filter="half">Half</button>
          <button class="tab-btn" data-filter="full">Full</button>
          <button class="tab-btn" data-filter="couple">Couple</button>
        </div>

        <div class="grid" id="adminGrid">
          <div class="empty-note">Đang tải danh sách tranh từ Cloudinary...</div>
        </div>

        <button type="button" class="btn-logout" id="logoutBtn">Đăng xuất khóa lại</button>
      </div>

      <div class="links-footer">
        <a href="index.html">← Quay về trang chủ xem Gallery</a>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_NAME = 'o6quhhtx';
    const UPLOAD_PRESET = 'nlinh_art';

    // Mã băm SHA-256 của mật khẩu (Mặc định hiện tại là: nlinh2026)
    // Người lạ có F12 xem code cũng chỉ thấy chuỗi mã hóa này chứ không biết mật khẩu thật
    const PASSWORD_HASH = 'a732f5e6e883d398916d915d87e5e0738b9676b2c2a96a7188022d04e050a5f0';

    const loginSection = document.getElementById('loginSection');
    const studioPanel = document.getElementById('studioPanel');
    const pwInput = document.getElementById('pwInput');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const errorMsg = document.getElementById('errorMsg');
    const subText = document.getElementById('subText');
    const togglePwBtn = document.getElementById('togglePwBtn');

    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const categorySelect = document.getElementById('categorySelect');
    const adminGrid = document.getElementById('adminGrid');

    let myWidget = null;
    let allArts = [];
    let currentFilter = 'all';

    // Hàm băm SHA-256
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Hiện / Ẩn mật khẩu khi bấm icon con mắt
    togglePwBtn.addEventListener('click', () => {
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        togglePwBtn.textContent = '🙈';
      } else {
        pwInput.type = 'password';
        togglePwBtn.textContent = '👁️';
      }
    });

    // Kiểm tra đăng nhập
    async function handleLogin() {
      const entered = pwInput.value.trim();
      if (!entered) return;

      const hashedInput = await sha256(entered);
      if (hashedInput === PASSWORD_HASH) {
        sessionStorage.setItem('nlinh_studio_unlocked', 'true');
        unlockStudio();
      } else {
        errorMsg.style.display = 'block';
        pwInput.value = '';
        pwInput.focus();
      }
    }

    loginBtn.addEventListener('click', handleLogin);
    pwInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('nlinh_studio_unlocked');
      location.reload();
    });

    function unlockStudio() {
      loginSection.style.display = 'none';
      errorMsg.style.display = 'none';
      studioPanel.style.display = 'block';
      subText.textContent = 'Chọn mục e thích và tải tranh lên  nha  ♡';

      // Chỉ khởi tạo Cloudinary Widget sau khi đã mở khóa
      if (!myWidget) {
        myWidget = cloudinary.createUploadWidget({
          cloudName: CLOUD_NAME,
          uploadPreset: UPLOAD_PRESET,
          sources: ['local', 'camera', 'url'],
          clientAllowedFormats: ['png', 'jpg', 'jpeg', 'webp', 'gif']
        }, (error, result) => {
          if (!error && result && result.event === "success") {
            const selectedCat = categorySelect.value;
            const newArt = {
              id: result.info.public_id,
              url: result.info.secure_url,
              category: selectedCat
            };

            allArts.unshift(newArt);
            renderAdminGrid();

            statusMsg.style.display = 'block';
            statusMsg.textContent = '✨ Đã tải ảnh lên thành công! Chờ 15-30s nha vợ  ♡';
          }
        });
      }

      fetchCloudArts();
    }

    // Tự động mở nếu trong phiên trình duyệt này đã nhập đúng mật khẩu
    if (sessionStorage.getItem('nlinh_studio_unlocked') === 'true') {
      unlockStudio();
    }

    uploadBtn.addEventListener('click', () => {
      if (!myWidget) return;
      const selectedCat = categorySelect.value;
      myWidget.update({
        tags: ['commission_art', selectedCat],
        context: { category: selectedCat }
      });
      myWidget.open();
    });

    async function fetchCloudArts() {
      try {
        const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/commission_art.json?_t=${Date.now()}`);
        if (!res.ok) {
          adminGrid.innerHTML = '<div class="empty-note">Chưa có tranh nào dc chọn aaaa ♡</div>';
          return;
        }
        const data = await res.json();
        if (data && data.resources) {
          allArts = data.resources.map(r => {
            const cat = (r.context && r.context.custom && r.context.custom.category) || 'chibi';
            return {
              id: r.public_id,
              url: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto/v${r.version}/${r.public_id}.${r.format}`,
              category: cat
            };
          });
          renderAdminGrid();
        }
      } catch (err) {
        adminGrid.innerHTML = '<div class="empty-note">Chưa có tranh nào được tải lên nìiiii :Đ</div>';
      }
    }

    function renderAdminGrid() {
      adminGrid.innerHTML = '';
      const filtered = currentFilter === 'all'
        ? allArts
        : allArts.filter(a => a.category === currentFilter);

      if (filtered.length === 0) {
        adminGrid.innerHTML = '<div class="empty-note">Chưa có tranh nào trong mục này :v</div>';
        return;
      }

      filtered.forEach(art => {
        const div = document.createElement('div');
        div.className = 'art-item';
        div.innerHTML = `
          <img src="${art.url}" alt="${art.category}" loading="lazy">
          <div class="art-tag">${art.category}</div>
        `;
        adminGrid.appendChild(div);
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAdminGrid();
      });
    });
  </script>
</body>
</html>
