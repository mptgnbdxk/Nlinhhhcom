<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Studio — Nlinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script src="gallery-data.js"></script>
  <style>
    :root {
      --pink: #d87093;
      --pink-soft: #ffe3e8;
      --bg: #fffafb;
      --card-bg: #ffffff;
      --ink: #5a4b51;
      --sub: #9b858d;
      --danger: #e76f51;
      --border: #f6ccd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 860px; }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(216, 112, 147, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: var(--pink-soft);
      color: var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 24px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      background: #fff5f7;
      border: 1px dashed #f1b3c3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .toolbar select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #ecd5db;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      background: white;
      cursor: pointer;
    }

    .btn-main {
      padding: 11px 22px;
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(216, 112, 147, 0.25);
      transition: all 0.2s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      background: #c96083;
    }

    .btn-secondary {
      padding: 10px 18px;
      background: white;
      color: var(--pink);
      border: 1.5px solid var(--pink);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: var(--pink);
      color: white;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid #ecd5db;
      background: white;
      color: var(--ink);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      text-align: left;
      margin-bottom: 24px;
    }

    .art-item {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 10px rgba(216, 112, 147, 0.05);
      display: flex;
      flex-direction: column;
    }

    .art-item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #fafafa;
    }

    .art-meta {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #fffcfd;
      border-top: 1px solid #f9ebef;
    }

    .art-meta select {
      flex: 1;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid #ecd5db;
      font-size: 0.8rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: var(--pink);
      background: white;
      outline: none;
      cursor: pointer;
    }

    .btn-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #f8ccd4;
      color: var(--danger);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: var(--danger);
      color: white;
      transform: scale(1.1);
    }

    .empty-note {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
      color: var(--sub);
      font-size: 0.9rem;
    }

    .links-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }
    .links-footer a {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .links-footer a:hover {
      color: var(--pink);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="badge">🌸 artist studio</div>
      <h1>Góc Quản Lý Tranh Của Nlinh</h1>
      <p class="subtitle">Upload tranh lên Cloudinary và tải file đồng bộ lên website</p>

      <div class="toolbar">
        <label for="uploadCategory" style="font-size: 0.88rem; font-weight: 600;">Danh mục:</label>
        <select id="uploadCategory">
          <option value="chibi">Chibi Portrait</option>
          <option value="head">Head Shots</option>
          <option value="half">Half Body</option>
          <option value="full">Full Body</option>
          <option value="couple">Couple</option>
        </select>

        <button type="button" class="btn-main" id="uploadBtn">🌸 Tải tranh mới lên</button>
        <button type="button" class="btn-secondary" id="exportBtn">📥 Tải file gallery-data.js</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-filter="all">Tất cả</button>
        <button class="tab-btn" data-filter="chibi">Chibi</button>
        <button class="tab-btn" data-filter="head">Head</button>
        <button class="tab-btn" data-filter="half">Half</button>
        <button class="tab-btn" data-filter="full">Full</button>
        <button class="tab-btn" data-filter="couple">Couple</button>
      </div>

      <div class="grid" id="artGrid"></div>

      <div class="links-footer">
        <a href="index.html">← Về trang chủ</a>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_NAME = 'o6quhhtx';
    const UPLOAD_PRESET = 'ml_default'; // Thay bằng Upload Preset Unsigned của bạn nếu có

    // Lấy dữ liệu từ localStorage hoặc file gallery-data.js
    let galleryArts = JSON.parse(localStorage.getItem('nlinh_gallery_data')) || 
                      (window.GLOBAL_GALLERY_DATA ? [...window.GLOBAL_GALLERY_DATA] : []);

    let currentFilter = 'all';

    function saveAndRender() {
      localStorage.setItem('nlinh_gallery_data', JSON.stringify(galleryArts));
      renderAdminGrid();
    }

    function renderAdminGrid() {
      const grid = document.getElementById('artGrid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'all' 
        ? galleryArts 
        : galleryArts.filter(item => item.category === currentFilter);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-note">Chưa có tranh nào trong mục này ♡</div>';
        return;
      }

      filtered.forEach(art => {
        const itemEl = document.createElement('div');
        itemEl.className = 'art-item';
        itemEl.innerHTML = `
          <button class="btn-delete" title="Xóa ảnh">&times;</button>
          <img src="${art.url}" alt="Artwork" loading="lazy" />
          <div class="art-meta">
            <select class="item-cat-select">
              <option value="chibi" ${art.category === 'chibi' ? 'selected' : ''}>Chibi</option>
              <option value="head" ${art.category === 'head' ? 'selected' : ''}>Head</option>
              <option value="half" ${art.category === 'half' ? 'selected' : ''}>Half</option>
              <option value="full" ${art.category === 'full' ? 'selected' : ''}>Full</option>
              <option value="couple" ${art.category === 'couple' ? 'selected' : ''}>Couple</option>
            </select>
          </div>
        `;

        itemEl.querySelector('.btn-delete').onclick = () => {
          if (confirm('Cậu có chắc muốn xóa tranh này không?')) {
            galleryArts = galleryArts.filter(a => a.id !== art.id);
            saveAndRender();
          }
        };

        itemEl.querySelector('.item-cat-select').onchange = (e) => {
          art.category = e.target.value;
          saveAndRender();
        };

        grid.appendChild(itemEl);
      });
    }

    // Cloudinary Upload Widget
    const uploadBtn = document.getElementById('uploadBtn');
    let myWidget = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local', 'camera', 'url'],
      tags: ['commission_art']
    }, (error, result) => {
      if (!error && result && result.event === "success") {
        const cat = document.getElementById('uploadCategory').value;
        const newArt = {
          id: result.info.public_id,
          url: result.info.secure_url,
          category: cat
        };
        galleryArts.unshift(newArt);
        saveAndRender();
      }
    });

    uploadBtn.addEventListener('click', () => {
      myWidget.open();
    });

    // Lọc theo Tab
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAdminGrid();
      });
    });

    // Xuất file gallery-data.js để ghi đè vào project
    document.getElementById('exportBtn').addEventListener('click', () => {
      const fileContent = `// File dữ liệu tranh đồng bộ toàn cầu (chạy được trên cả điện thoại và máy tính)\nwindow.GLOBAL_GALLERY_DATA = ${JSON.stringify(galleryArts, null, 2)};\n`;
      const blob = new Blob([fileContent], { type: 'application/javascript;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'gallery-data.js';
      link.click();
      URL.revokeObjectURL(link.href);
      alert('Đã tải file gallery-data.js! Cậu chỉ cần copy đè file này vào thư mục web rồi đẩy lên hosting là điện thoại sẽ xem được ngay nhé ♡');
    });

    renderAdminGrid();
  </script>
</body>
</html>
